<!DOCTYPE html>
<html>
    <head>
        <title></title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h3><a href="index.html">PIXL</a></a></h3>
            <div class="tools">
                <div>
                    <img src="src/Draw.svg" id="Draw">
                    <img src="src/Eraser.svg" id="Eraser">
                    <img src="src/Fill.svg" id="Fill"> 
                    <hr>
                </div>
                <div>
                    <img src="src/GridOn.svg" id="GridOn">
                    <img src="src/Undo.svg" id="Undo">
                    <img src="src/Delete.svg" id="Delete">
                    <img src="src/Download.svg" id="Download">
                    <img src="src/Save.svg" id="Save">
                    <hr>
                </div>
                <div>
                    <img src="src/DarkMode.svg" id="Theme">
                </div>
            </div>
        </header>
        <main class="drawing-panel">
            <div>
                <!-- Сетка -->
                <section class="grid"></section>
            </div>
            <!-- Палитра -->
            <section class="sidebar">
                <article>
                    <h2>Цвет</h2>
                    <p><input type="color" id="colorpicker" value="#7c3aed"></p>
                </article>
                <article>
                    <h2>Палитра</h2>
                    <div class="palette">

                    </div>
                </article>
                <article>
                    <button><img src="src/Download.svg">Импорт</button>
                    <button><img src="src/Delete.svg">Очистка</button>
                </article>
            </section>
        </main>
        <footer>
            
        </footer>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/dom-to-image/2.6.0/dom-to-image.min.js"></script>
        <script src="script.js"></script>
    </body>
</html>
